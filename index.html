/* =====================================================================
   18g. VERSION, UPDATE CHECK & HOME-SCREEN INSTALL
   version.json (next to index.html on GitHub Pages) holds the latest version.
   The game checks it on every launch and from "Check for updates".
   ===================================================================== */
const GAME_VERSION = '1.0.0';
const SITE_URL = 'https://shieldsyncofficial.github.io/signal-noise/';
const UPD = { latest: null, checking: false, dismissed: false, last: 0 };
function verCmp(a, b) { const pa = String(a).split('.').map(n => parseInt(n, 10) || 0), pb = String(b).split('.').map(n => parseInt(n, 10) || 0); for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0) ? 1 : -1; } return 0; }
const onSite = () => /^https?:$/.test(location.protocol) && /github\.io$/.test(location.hostname);
async function checkUpdates(manual) {
  if (UPD.checking) return; UPD.checking = true; if (manual) toast('Checking for updates…');
  const ctl = window.AbortController ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 8000);
  try {
    const res = await fetch((onSite() ? 'version.json' : SITE_URL + 'version.json') + '?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const v = await res.json(); UPD.latest = v; UPD.last = Date.now();
    if (v && v.version && verCmp(v.version, GAME_VERSION) > 0) { if (manual) UPD.dismissed = false; if (!UPD.dismissed) showUpdateBanner(v); if (manual) showWhatsNew(v); }
    else if (manual) toast(`You're on the latest version (v${GAME_VERSION}) ✓`, 'good');
  } catch (e) { if (manual) toast('Couldn\'t check for updates. Are you offline?', 'warn'); }
  finally { clearTimeout(to); UPD.checking = false; }
}
function showUpdateBanner(v) {
  let b = $('#updBanner');
  if (!b) {
    b = document.createElement('div'); b.id = 'updBanner'; $('#stage').appendChild(b);
    b.addEventListener('click', e => { const t = e.target.closest('[data-upd]'); if (!t) return; const k = t.dataset.upd;
      if (k === 'go') applyUpdate(); else if (k === 'notes') showWhatsNew(UPD.latest); else { UPD.dismissed = true; b.classList.add('hidden'); $('#stage').classList.remove('has-upd'); } });
  }
  b.innerHTML = `<span>🆕 <b>v${esc(v.version)}</b> is available <span class="muted">(you have v${GAME_VERSION})</span></span><span class="sp"></span><button class="btn sm" data-upd="notes">What's new</button><button class="btn sm primary" data-upd="go">Update now</button><button class="btn sm ghost" data-upd="x" title="Remind me next time">✕</button>`;
  b.classList.remove('hidden'); $('#stage').classList.add('has-upd');
}
function showWhatsNew(v) {
  if (!v) return;
  const newer = verCmp(v.version, GAME_VERSION) > 0;
  modal({ title: `WHAT'S NEW IN v${esc(v.version)}`, ico: '🆕', body: `<p class="muted">${v.released ? 'Released ' + esc(v.released) + ' · ' : ''}you have v${GAME_VERSION}</p><ul class="wlist">${(v.notes || []).map(n => '<li>' + esc(n) + '</li>').join('') || '<li>Fixes and improvements.</li>'}</ul>`,
    buttons: newer ? [{ label: 'Later', cls: 'ghost' }, { label: 'Update now', cls: 'primary', fn: applyUpdate }] : [{ label: 'Close', cls: 'primary' }] });
}
/** Save everything, then load the new version (a downloaded copy can't update itself, so open the site instead). */
function applyUpdate() {
  const v = UPD.latest || { version: '' };
  try { save(); } catch (e) { /* nothing to save */ }
  const go = () => {
    if (/^https?:$/.test(location.protocol)) location.replace(location.pathname + '?v=' + encodeURIComponent(v.version) + location.hash);
    else {
      window.open(SITE_URL, '_blank', 'noopener');
      modal({ title: 'DOWNLOADED COPY', ico: '📥', body: `<p>You're playing a copy saved on this device, which can't update itself. The latest version has opened in a new tab at <span class="mono cy">${SITE_URL}</span>.</p><p class="muted">Play there (you can add it to your home screen), or save that page again to replace this copy. Your account and progress carry over.</p>` });
    }
  };
  if (acct()) { cloudSave(true); flushOutbox().then(go, go); } else go();
}

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Installed! Open SIGNAL//NOISE from your home screen.', 'good'); });
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function showInstall() {
  if (deferredInstall) { const p = deferredInstall; deferredInstall = null; p.prompt(); return; }
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  const site = /^https?:$/.test(location.protocol);
  const tip = (on, h, p) => `<div class="card ${on ? 'owned' : ''}" style="margin-bottom:8px"><h4>${h}</h4><p>${p}</p></div>`;
  modal({ title: 'ADD TO HOME SCREEN', ico: '📲', body: (site ? '' : `<p class="am">You're playing a downloaded copy. To add the game to your home screen, open <span class="mono cy">${SITE_URL}</span> in your browser first.</p>`) +
    tip(ios, '🍎 iPhone / iPad (Safari)', 'Tap <b>Share</b> (the square with an arrow ↑), then <b>Add to Home Screen</b> → <b>Add</b>.') +
    tip(android, '🤖 Android (Chrome)', 'Tap <b>⋮</b> (top right), then <b>Add to Home screen</b> or <b>Install app</b> → <b>Add</b>.') +
    tip(!ios && !android, '💻 Computer (Chrome / Edge)', 'Click the <b>install icon</b> at the right of the address bar, or <b>⋮</b> → <b>Cast, save and share</b> → <b>Install page as app</b>. Edge: <b>⋯</b> → <b>Apps</b> → <b>Install this site as an app</b>.') +
    '<p class="muted">It opens full-screen with its own icon. You need an internet connection to start it, your progress stays in your account, and it checks for updates every time it opens.</p>' });
}

/* =====================================================================
   19. INPUT — mouse delegation & keyboard shortcuts
   ===================================================================== */
function selectAlert(id) { S.ui.sel = id; S.ui.view = null; S.ui.tab = 'logs'; if (S.mobile) setPane('mon2'); tut('select'); dirty(1, 1, 0); Sound.click(); }
function moveSel(dir) {
  const ids = queueOrder(); if (!ids.length) return;
  let i = ids.indexOf(S.ui.sel); i = i < 0 ? 0 : clamp(i + dir, 0, ids.length - 1);
  selectAlert(ids[i]);
  const row = $(`#queue .qrow[data-id="${ids[i]}"]`); if (row) row.scrollIntoView({ block: 'nearest' });
}
function togglePause() { if (!isLive()) return; S.paused = !S.paused; toast(S.paused ? 'Paused' : 'Resumed'); renderHUD(); }
function toggleSound() { S.meta.settings.sound = !S.meta.settings.sound; saveMeta(); if (S.meta.settings.sound) Sound.good(); renderHUD(); renderDesk(); }
function currentAlert() { const a = S.ui.sel && getAlert(S.ui.sel); return a && a.status === 'open' ? a : null; }

function bindInput() {
  $('#queue').addEventListener('click', e => { const ff = e.target.closest('[data-act="ff"]'); if (ff) { S.ff = !S.ff; renderHUD(); return; } const row = e.target.closest('.qrow'); if (row && isLive()) selectAlert(row.dataset.id); });
  $('#ws').addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = S.ui.view ? getAlert(S.ui.view) : getAlert(S.ui.sel), act = el.dataset.act;
    if (act === 'tab') { S.ui.tab = el.dataset.tab; dirty(0, 1, 0); }
    else if (act === 'opentab') openTab(a, el.dataset.tab);
    else if (act === 'insp') inspect(a, S.ui.tab, +el.dataset.i);
    else if (act === 'dec') decide(a, el.dataset.v);
    else if (act === 'back') { S.ui.view = null; if (S.mobile) setPane('mon1'); dirty(0, 1, 0); }
    else if (act === 'hint') useHint(a);
    else if (act === 'break') takeBreak();
    else if (act === 'sip') sip();
    renderWS();
  });
  $('#ctabs').addEventListener('click', e => { const t = e.target.closest('[data-ctab]'); if (t) { S.ui.ctab = t.dataset.ctab; dirty(0, 0, 1); renderComms(); } });
  $('#comms').addEventListener('click', e => {
    if (e.target.closest('[data-act="skiptut"]')) { skipTut(); return; }
    const tk = e.target.closest('[data-view]'); if (tk) { S.ui.view = tk.dataset.view; if (S.mobile) setPane('mon2'); dirty(0, 1, 0); return; }
    const an = e.target.closest('[data-ans]'); if (an) { const [i, j] = an.dataset.ans.split(':').map(Number); answerObj(i, j); renderComms(); return; }
    const ob = e.target.closest('[data-obj]'); if (ob && sh().bridge) { const b = sh().bridge; const i = +ob.dataset.obj; if (!b.objs[i].done) { b.open = i; renderComms(); } }
  });
  $('#overlay').addEventListener('click', e => {
    if (S.overlay === 'walk' && walkClick(e)) return;
    const lt = e.target.closest('[data-lbtab]'); if (lt) { LB.tab = lt.dataset.lbtab; renderLeaderboard(); lbFetch(false); return; }
    const lk = e.target.closest('[data-lbkind]'); if (lk) { LB.kind = lk.dataset.lbkind; renderLeaderboard(); lbFetch(false); return; }
    const g = e.target.closest('[data-go]'), buy = e.target.closest('[data-buy]'), ah = e.target.closest('[data-act-home]'), ce = e.target.closest('[data-cert]');
    if (buy) { const u = UNLOCKS.find(x => x.id === buy.dataset.buy); if (u && S.meta.lp >= u.cost) { S.meta.lp -= u.cost; S.meta.unlocks[u.id] = true; saveMeta(); if (UNLOCKS.every(x => S.meta.unlocks[x.id])) grantAch('allunlocks'); Sound.good(); toast('Unlocked: ' + u.name, 'good'); showUnlocks(); } return; }
    if (ah) { doHome(ah.dataset.actHome); return; }
    if (ce) { doCert(ce.dataset.cert); return; }
    const dc = e.target.closest('[data-diff]'); if (dc) { $$('.diffcard').forEach(x => x.classList.toggle('on', x === dc)); Sound.click(); return; }
    const pt = e.target.closest('[data-ptab]'); if (pt) { showProfile(pt.dataset.ptab, S.profileBack); return; }
    const hi = e.target.closest('[data-hist]'); if (hi) { showHistoryDetail(+hi.dataset.hist); return; }
    if (!g) return;
    Sound.click();
    const go = g.dataset.go;
    switch (go) {
      case 'menu': LB.back = null; showStart(); break;
      case 'pause': showPauseMenu(); break;
      case 'new': showNewRun(); break;
      case 'reroll': $('#seedIn').value = randomSeed(); break;
      case 'start': { const seed = ($('#seedIn').value || '').trim().toUpperCase() || randomSeed(); const dsel = $('.diffcard.on'); newRun(seed, +$('#tierIn').value, dsel ? dsel.dataset.diff : 'standard'); break; }
      case 'continue': { const run = getSavedRun(); if (!run) { showStart(); break; } S.run = normalizeRun(run); S.suspended = null; closeOverlay(); resumeRun(); break; }
      case 'load': showLoadScreen('menu'); break;
      case 'load2': showLoadScreen('pause'); break;
      case 'download': downloadSave(); break;
      case 'cards': closeOverlay(); showCardsModal(); break;
      case 'shifthist': closeOverlay(); showShiftHistory(S.run.shiftLog, 'This run'); break;
      case 'shifthist-home': showShiftHistory(S.run.shiftLog, 'This run'); break;
      case 'fullscreen': toggleFullscreen(); break;
      case 'check-upd': checkUpdates(true); break;
      case 'install': showInstall(); break;
      case 'load-acc': showLoadScreen('account'); break;
      case 'account': showAccount(S.acctMode || 'register'); break;
      case 'acc-submit': submitAccount(); break;
      case 'acc-reg': showAccount('register'); break;
      case 'acc-login': showAccount('login', { name: acctAny() ? acctAny().username : '' }); break;
      case 'acc-offline': S.meta.profile.named = true; if (!S.meta.profile.name) S.meta.profile.name = 'Analyst'; saveMeta(); toast('Playing offline. Create an account any time from your Profile.', 'warn'); routeHome(); break;
      case 'acc-logout': logout(); break;
      case 'acc-pass': changePasscode(); break;
      case 'acc-sync': cloudSave(true); flushOutbox().then(() => { toast((S.meta.outbox || []).length ? 'Couldn\'t reach the server' : 'Synced to the cloud', (S.meta.outbox || []).length ? 'warn' : 'good'); if (S.overlay === 'profile') showProfile('stats', S.profileBack); }); break;
      case 'tutorial': startWalkthrough(false); break;
      case 'leaderboard': showLeaderboard(LB.back || 'menu'); break;
      case 'leaderboard2': showLeaderboard('pause'); break;
      case 'lb-refresh': lbFetch(true); break;
      case 'lb-summary': LB.kind = 'careers'; showLeaderboard('menu'); break;
      case 'walk-next': walkNext(); break;
      case 'walk-back': if (S.walk && S.walk.i > 0) { S.walk.i--; renderWalk(); } break;
      case 'walk-close': S.walk = null; showStart(); break;
      case 'profile': showProfile('stats', 'menu'); break;
      case 'profile2': showProfile('stats', 'pause'); break;
      case 'profile-ach': showProfile('ach', 'menu'); break;
      case 'profile-hist': showProfile('hist', 'menu'); break;
      case 'pname': { const v = ($('#pName').value || '').trim().slice(0, 16) || 'Analyst'; S.meta.profile.name = v; saveMeta(); renderDesk(); toast('Callsign saved: ' + v, 'good'); showProfile('stats', S.profileBack); break; }
      case 'unlocks': showUnlocks(); break;
      case 'settings': showSettings('menu'); break;
      case 'settings2': showSettings('pause'); break;
      case 'pause': showPauseMenu(); break;
      case 'howto': showHowTo('menu'); break;
      case 'howto2': showHowTo('pause'); break;
      case 'resume': closeOverlay(); S.paused = false; break;
      case 'savequit': save(); closeAllModals(); S.suspended = S.run; S.run = null; S.paused = false; renderAll(); showStart(); break;
      case 'menuFromHome': save(); S.suspended = S.run; S.run = null; renderAll(); showStart(); break;
      case 'resign': modal({ title: 'RESIGN?', ico: '✖', body: '<p>End this run now? You will still earn Legacy Points for what you achieved.</p>', buttons: [{ label: 'Cancel', cls: 'ghost' }, { label: 'Resign', cls: 'danger', fn() { closeOverlay(); endRun('resigned'); } }] }); break;
      case 'reset': modal({ title: 'RESET PROGRESS', ico: '⚠', body: `<p>Delete all unlocks, Legacy Points, achievements, history and the current run?${acctAny() ? ' This also resets your <b>cloud save</b>. Your account and leaderboard scores stay.' : ''}</p>`, buttons: [{ label: 'Cancel', cls: 'ghost' }, { label: 'Delete everything', cls: 'danger', fn() { const keepAcct = S.meta.account; Store.del(SAVE_RUN); Store.del(SAVE_META); S.suspended = null; S.meta = defaultMeta(); if (keepAcct) { S.meta.account = keepAcct; S.meta.profile.name = keepAcct.username; S.meta.profile.id = keepAcct.pid; S.meta.profile.named = true; } applySettings(); S.run = null; saveMeta(); cloudSave(true); renderAll(); routeHome(); } }] }); break;
      case 'work': backToWork(); break;
      case 'promote': promote(); break;
      case 'retire': endRun('retired'); break;
    }
  });
  $('#mug').addEventListener('click', () => { if (S.run && S.run.mug <= 0) refill(); else sip(); });
  $('#headset').addEventListener('click', toggleSound);
  $('#lamp').addEventListener('click', () => { document.body.classList.toggle('lamp-on'); $('#lampBulb').setAttribute('opacity', document.body.classList.contains('lamp-on') ? '1' : '.25'); Sound.click(); });
  $('#phone').addEventListener('click', () => { if (!$('#phone').classList.contains('ring')) toast('Dial tone. Nobody to call.'); });
  $('#badge').addEventListener('click', () => { if (S.run) toast(`${TIERS[S.run.tier]} · ${S.run.shiftCount} shifts · ${Object.keys(S.run.certs).length} certs`); });
  $('#sticky').addEventListener('click', () => { if (S.run) toast('Seed: ' + S.run.seed + ' — share it to replay this career'); });
  $('#btnPause').addEventListener('click', togglePause);
  $('#btnFF').addEventListener('click', () => { if (isLive()) { S.ff = !S.ff; renderHUD(); } });
  $('#btnSound').addEventListener('click', toggleSound);
  $('#hudCards').addEventListener('click', showCardsModal);
  $('#hudCPBtn').addEventListener('click', showCPInfo);
  $('#mtabs').addEventListener('click', e => { const b = e.target.closest('[data-mtab]'); if (b) { setPane(b.dataset.mtab); Sound.click(); dirty(); } });
  $('#mCoffee').addEventListener('click', () => { if (S.run && S.run.mug <= 0) refill(); else sip(); });
  if (window.ResizeObserver) new ResizeObserver(measureHud).observe($('#hud'));
  $('#btnMenu').addEventListener('click', () => { if (S.run && !S.run.ended && S.modal === 0) showPauseMenu(); else if (!S.run) showStart(); });
  window.addEventListener('resize', fit);
  // Pause when the tab is hidden; persist on close so a refresh never loses the shift.
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (isLive() && !S.paused) { S.paused = true; S.autoPaused = true; } save(); } });
  window.addEventListener('pagehide', () => save());
  bindDragDrop();

  document.addEventListener('keydown', e => {
    if (e.target.matches && e.target.matches('input,select,textarea')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    flashKey(k === 'Enter' ? '⏎' : k);
    if (S.modal > 0) { if (k === ' ') e.preventDefault(); const pick = $$('.modal-back.card-pick [data-card]'); if (pick.length && /^[1-3]$/.test(k) && pick[+k - 1]) pick[+k - 1].click(); return; }
    if (S.overlay) { if (k === 'Escape' && S.overlay === 'pause') { closeOverlay(); S.paused = false; } return; }
    if (!S.run || S.run.ended) return;
    if (k === ' ') { e.preventDefault(); togglePause(); return; }
    if (k === 'Escape') { showPauseMenu(); return; }
    if (k === 'm') { toggleSound(); return; }
    if (k === 'l') { $('#lamp').click(); return; }
    if (!isLive()) return;
    const a = currentAlert();
    switch (k) {
      case 'j': case 'ArrowDown': e.preventDefault(); moveSel(1); break;
      case 'k': case 'ArrowUp': e.preventDefault(); moveSel(-1); break;
      case '1': case '2': case '3': case '4': case '5': if (a) { const t = TABS[+k - 1][0]; if (a.ev[t].length) { if (a.tabs[t]) { S.ui.tab = t; dirty(0, 1, 0); } else openTab(a, t); } } break;
      case 'f': decide(a, 'fp'); break;
      case 'b': decide(a, 'btp'); break;
      case 'e': decide(a, 'esc'); break;
      case 'p': decide(a, 'ip'); break;
      case 'i': decide(a, 'host'); break;
      case 'd': decide(a, 'account'); break;
      case 'c': showCardsModal(); break;
      case 'q': sip(); break;
      case 'r': refill(); break;
      case 't': S.ff = !S.ff; renderHUD(); break;
    }
  });
}
function resumeRun() {
  const r = S.run; S.ui = Object.assign(S.ui, { sel: null, view: null, ctab: 'chat' });
  if (r.phase === 'home') { renderAll(); showHome(); return; }
  const s = r.shift; renderAll();
  if (s.phase === 'handoffIn') showIncomingHandoff();
  else if (s.phase === 'live') { S.paused = true; toast('Shift resumed — paused. Press Space to continue.'); }
  else if (s.phase === 'handoffOut') { s.hoItems = buildHandoffItems(); showOutgoingHandoff(s.hoItems); }
  else if (s.phase === 'report') showShiftReport(s.report);
}

/* =====================================================================
   20. MAIN LOOP & BOOT
   ===================================================================== */
let lastFrame = performance.now(), uiAcc = 0;
function frame(now) {
  const dt = Math.min(.25, (now - lastFrame) / 1000); lastFrame = now;
  try {
    if (isRunning()) advance(dt * speedNow());
    uiAcc += dt;
    if (uiAcc > .2) {
      uiAcc = 0;
      renderHUD();
      if (S.ui.dq) renderQueue(); else updateQueueTimers();
      if (S.ui.dw) renderWS();
      if (S.ui.dc) renderComms();
      const s = sh(); if (s && s.bridge && s.bridge.active) { const bt = $('#bridgeTimer'), bb = $('#bridgeBar'); if (bt) bt.textContent = fmtDur(s.bridge.left); if (bb) bb.style.width = clamp(s.bridge.left / s.bridge.total * 100, 0, 100) + '%'; }
      renderDesk();
      drawSky(false);
    }
    if (S.run && !S.run.ended && isLive() && now - S.lastSave > 15000) { S.lastSave = now; save(); }
  } catch (err) { console.warn('Frame error', err); }
  requestAnimationFrame(frame);
}
function boot() {
  buildKeyboard(); bindInput(); fit(); applySettings(); renderAll(); saveMeta(); routeHome();
  flushOutbox(); window.addEventListener('online', () => flushOutbox());
  if (acct()) backfillHistory();
  setTimeout(() => checkUpdates(false), 1200); // automatic version check on every launch
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - UPD.last > 30 * 60000) checkUpdates(false); });
  requestAnimationFrame(frame);
}
boot();
</script>
